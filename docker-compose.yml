services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: messenger
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      AUTH_MODE: local
      JWT_SECRET: dev-secret-change-me
      SEED: "true"
      DB_HOST: db
      DB_USER: messenger
      DB_PASSWORD: senha
      DB_NAME: messenger
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
